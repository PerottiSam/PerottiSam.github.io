<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Reset Password – Respawn</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>Nuova Password</h2>
  <input type="password" id="password" placeholder="Nuova password" />
  <input type="password" id="confirm" placeholder="Conferma password" />
  <button onclick="resetPassword()">Salva</button>

  <script>
    const { createClient } = supabase;
    const client = createClient('https://ltvqdcoqifkbuhiqmazd.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0dnFkY29xaWZrYnVoaXFtYXpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg2NjM4NjYsImV4cCI6MjA3NDIzOTg2Nn0.0YECLj5Y8dZwr4nJKlH5lt-JKGBRlUhA66q-D-1KLoc');

    // Supabase mette i token nel fragment dell'URL
    // Questo li legge automaticamente
    client.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        // L'utente è autenticato, può cambiare la password
        console.log('Pronto per il reset');
      }
    });

    async function resetPassword() {
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (password !== confirm) {
        alert('Le password non coincidono');
        return;
      }

      const { error } = await client.auth.updateUser({ password });

      if (error) {
        alert('Errore: ' + error.message);
      } else {
        alert('Password aggiornata! Ora puoi accedere dall\'app.');
      }
    }
  </script>
</body>
</html>
